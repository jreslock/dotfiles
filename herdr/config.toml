onboarding = false
# herdr config -- overrides only; anything omitted uses herdr's defaults.
# Full annotated reference: `herdr --default-config`
# Apply changes to a running server: `herdr server reload-config` (or prefix+shift+r)

[ui]
# Agent panel ordering: "spaces" (grouped by space) or "priority" (blocked-first attention queue).
agent_panel_sort = "spaces"

# ---------------------------------------------------------------------------
# Agent presets via the om1incubator/herdr-presets plugin (installed by setup;
# presets tracked in dotfiles/herdr/agents.json, `ha` in ~/.local/bin).
# prefix+a opens a picker; the rest start a favourite next to the focused pane.
# ---------------------------------------------------------------------------
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "om1incubator.herdr-presets.pick"
description = "start an agent from a preset"

[[keys.command]]
key = "prefix+alt+q"
type = "shell"
command = "\"$HOME/.local/bin/ha\" qwen"
description = "start qwen (OpenCode, Qwen3 Coder Next on Bedrock)"

[[keys.command]]
key = "prefix+alt+s"
type = "shell"
command = "\"$HOME/.local/bin/ha\" sol"
description = "start sol (Codex, GPT-5.6 Sol on Bedrock)"

[[keys.command]]
key = "prefix+alt+c"
type = "shell"
command = "\"$HOME/.local/bin/ha\" claude"
description = "start claude (Claude Code on Teams)"
